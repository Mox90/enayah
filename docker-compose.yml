services:
  nginx:
    image: nginx:alpine
    container_name: enayah-nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:15
    container_name: enayah-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: enayah_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: enayah-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./enayah-backend
    container_name: enayah-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '4000'
    env_file:
      - ./enayah-backend/.env
    volumes:
      - ./enayah-backend:/app:cached
      - backend_node_modules:/app/node_modules
      - public_file_storage:/app/storage/public
      - private_file_storage:/app/storage/private
    command: npm run dev
    labels:
      ofelia.enabled: 'true'
      ofelia.job-exec.notification-generator.schedule: '0 0 1 * * *'
      ofelia.job-exec.notification-generator.command: 'npm run notifications:generate'

  frontend:
    build: ./enayah-frontend
    container_name: enayah-frontend
    restart: always
    depends_on:
      - backend
    expose:
      - '3000'
    env_file:
      - ./enayah-frontend/.env
    environment:
      DEV_HOST: ${DEV_HOST}
    volumes:
      - ./enayah-frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    command: npm run dev

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: enayah-ofelia
    restart: always
    depends_on:
      - backend
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: daemon --docker

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
  public_file_storage:
  private_file_storage:
